; ============================================================================
;  RADIO LIBRE  -  stations internet pour GTA V Enhanced
; ============================================================================
;
;  COMMENT CHANGER DE STATION
;  --------------------------
;  MAINTIENS LA TOUCHE RADIO du jeu, celle qui ouvre normalement la roue des
;  stations : Q au clavier, croix directionnelle gauche a la manette.
;  Un selecteur apparait un peu au-dessus du centre. Au stick droit :
;
;      haut / bas   deplacer la selection
;      droite       entrer dans le pays, ou lancer la station
;      gauche       revenir a la liste des pays
;      relacher     fermer
;
;  Gauche ramene toujours en arriere, droite fait toujours avancer : le
;  fonctionnement est le meme aux deux niveaux. Aucun clic de stick n'est
;  utilise, et il n'y a pas de bouton de fermeture : relacher suffit.
;
;  RADIO OFF est au premier niveau, il n'y a donc pas besoin d'entrer dans un
;  pays pour couper la musique.
;
;  Les touches clavier plus bas restent disponibles comme raccourcis.
; ============================================================================

[General]

; ---- volume ----
; PROPORTION du curseur "Musique" des reglages audio du jeu, entre 0.0 et 1.0.
; A 1.00 la radio suit exactement le volume musique de GTA ; baisse cette
; valeur si tu la trouves plus forte que la musique du jeu.
; Reglable en jeu, et la valeur choisie est reecrite ici.
Volume=1.00

; ---- touches clavier ----
; Noms valides : F1..F12, NumPad0..NumPad9, Insert, Delete, Home, End,
; PageUp, PageDown, et les lettres.
NextStationKey=F10
PrevStationKey=F9
; Le pave numerique envoie NumPad9 / NumPad3 verrou actif, PageUp / PageDown
; sinon. Les quatre sont acceptees, ainsi que + et - du pave numerique.
VolumeUpKey=NumPad9
VolumeDownKey=NumPad3

; Coupe ou retablit la radio sans toucher au volume ni a la station :
; pratique pour un appel ou un moment de mission, sans perdre le niveau
; regle a l oreille.
MuteKey=NumPad0

; Inverse le sens haut / bas du selecteur, si le defilement te parait a
; l'envers sur ta manette.
InvertMenuAxis=false

; ---- comportement ----
; La radio se tait dans le menu pause et a pied, comme celle d'un vehicule.
; Le flux continue d'etre recu pendant le silence : a la reprise on entend le
; direct en cours, pas la suite de ce qui jouait avant la pause.

; Eteint la radio du vehicule tant qu'une station joue, pour eviter que les
; deux se superposent. L'extinction est reappliquee regulierement, le jeu
; rallumant sa radio de lui-meme a l'entree dans un vehicule.
MuteGameRadio=true

; Asservit la radio au curseur "Musique" des reglages audio du jeu, relu
; plusieurs fois par seconde. Le changer en pleine ecoute agit aussitot, sans
; reconnecter le flux. A Musique = 0, la radio est exactement silencieuse.
; A false, la radio ignore les reglages du jeu et n'obeit qu'a Volume.
FollowGameAudioSettings=true

; ---- affichage ----
; Petit encart en bas a droite : logo, titre, artiste, station.
;   Auto    apparait quelques secondes a chaque changement, puis s'efface
;   Always  reste affiche tant qu'une station joue
;   Off     jamais affiche
NowPlaying=Auto

; Duree d'affichage en mode Auto.
NowPlayingSeconds=5

; De combien l'encart remonte depuis le bas de l'ecran.
; GTA annonce le quartier traverse dans ce meme coin : a 0 l'encart lui
; passerait dessus. Augmente si les deux se chevauchent encore chez toi.
NowPlayingRaise=70

; Ralenti pendant que la roue est ouverte, comme la roue d'origine de GTA.
; 1.00 = aucun ralenti, 0.30 = trois fois plus lent.
WheelSlowMotion=0.30

; Ce qu'il reste du volume pendant une MISSION ou un DIALOGUE.
; La radio passe derriere la voix, puis remonte seule quand c'est fini.
; 0.30 = soixante-dix pour cent de moins.  1.00 = ne rien baisser.  0.00 = couper.
; Une CINEMATIQUE, elle, coupe toujours completement.
;
; La radio se coupe aussi, avec un fondu, dans ces cas :
;   ecran noir (chargement, teleportation), mort ou arrestation,
;   changement de personnage, moteur coupe, velo, epave, vehicule sous l'eau.

; Faire aussi baisser sur les repliques d'ambiance des PNJ.
; Deconseille : un passant qui rale suffit a faire plonger la musique.
DuckOnAmbientSpeech=false
DuckDuringDialogue=0.30

; ---- diagnostic ----
; Trace detaillee du volume, de la pause et des reglages du jeu :
;   [AudioDiag] GET_MUSIC_VOL_SLIDER = 3   PROFILE_301 = 3
;   [PauseDiag] verrou = True
;   [Reglages]  reglage 301 : 1 -> 3
; A n activer que pour diagnostiquer : le journal grossit vite.
AudioLog=false


