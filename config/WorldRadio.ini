; ============================================================================
;  Stations
; ----------------------------------------------------------------------------
;  Tous les flux ci-dessous ont ete verifies : reponse du serveur, lecture
;  effective par Media Foundation, et presence du titre en direct.
;  Le flux doit etre un MP3 ou AAC direct ; les listes de lecture .m3u,
;  .pls et .m3u8 ne sont pas lues.
; ============================================================================

; ---------------------------- FRANCE ----------------------------

; ----------------------------------------------------------------------------
;  NIVEAU DES STATIONS
;  Les radios ne sont pas masterisees au meme niveau : 11 LU separaient la plus
;  forte (Skyrock) de la plus faible (HOT 97), soit un rapport de quatre a
;  l oreille. Chaque station porte donc une correction Gain=, en dB, qui la
;  ramene a -14 LUFS, le niveau de reference de Spotify et YouTube.
;
;  Mesure selon ITU-R BS.1770 (ponderation K, portes a -70 LUFS et -10 LU),
;  sur quatre a huit minutes d ecoute par station, moyenne en energie.
;  Un limiteur a -1 dBFS empeche les stations remontees de saturer.
;
;  Ce qui reste d ecart vient du contenu : un flash info est plus calme
;  qu un morceau, sur la meme station. Gain= se regle a la main si besoin.
; ----------------------------------------------------------------------------

[Station1]
Enabled=true
Country=FRANCE
Name=SKYROCK
Url=https://icecast.skyrock.net/s/natio_mp3_128k
; niveau mesure : -7.41 LUFS, ramene a -14 LUFS
Gain=-6.6
Icon=station_SKYROCK.png

[Station2]
Enabled=true
Country=FRANCE
Name=NRJ
Url=https://streaming.nrjaudio.fm/oumvmk8fnozc?origine=fluxradios
; niveau mesure : -10.54 LUFS, ramene a -14 LUFS
